<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nature Hunt</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #55ab37; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #55ab37;
            background-image: 
                linear-gradient(115deg, transparent 75%, rgba(46, 125, 50, 0.7) 75%, rgba(46, 125, 50, 0.7) 80%, transparent 80%),
                linear-gradient(245deg, transparent 75%, rgba(56, 142, 60, 0.6) 75%, rgba(56, 142, 60, 0.6) 80%, transparent 80%),
                linear-gradient(105deg, transparent 65%, rgba(30, 90, 35, 0.4) 65%, rgba(30, 90, 35, 0.4) 70%, transparent 70%);
            background-size: 40px 60px;
            transition: background 0.5s ease;
        }

        /* Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #splash-screen h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ffc107;
        }

        #splash-screen p {
            color: #333;
            font-size: 1rem;
            margin-bottom: 15px;
            max-width: 500px;
            line-height: 1.4;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
        }

        .mode-btn {
            padding: 12px 20px;
            font-size: 1.1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            font-weight: bold;
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        .mode-btn.ladybug-theme { background-color: #c62828; }
        .mode-btn.butterfly-theme { background-color: #0277bd; }
        .mode-btn.bee-theme { background-color: #fbc02d; color: #333; }
        .mode-btn.endless-theme { background-color: #7b1fa2; }

        /* UI */
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
            z-index: 50;
        }

        .ui-left {
            display: flex;
            gap: 20px;
        }

        #menu-btn {
            padding: 6px 14px;
            font-size: 1rem;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }

        #menu-btn:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* Game Elements */
        .clutter, .target-creature {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%);
            font-size: 2.5rem; 
        }

        .clutter {
            z-index: 10;
            pointer-events: none; 
            transition: opacity 0.2s ease-out;
        }

        .target-creature {
            z-index: 12; 
            cursor: pointer;
            animation: flutter 1.2s infinite alternate ease-in-out;
            transition: filter 0.3s ease, transform 0.3s ease;
            opacity: 0.95; 
        }

        @keyframes flutter {
            0% { transform: translate(-50%, -50%) rotate(-3deg) scale(0.98); }
            100% { transform: translate(-50%, -50%) rotate(3deg) scale(1.02); }
        }

        /* Game Over Screen */
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-over button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer" style="display: none;">
        <div class="ui-left">
            <div id="score-display">Score: 0</div>
            <div id="time-display">Time: 60</div>
        </div>
        <button id="menu-btn">🏠 Menu</button>
    </div>
    
    <div id="entities-layer"></div>

    <div id="splash-screen">
        <h1>🌿 Nature Hunt 🌸</h1>
        <p>Choose your game mode and spot the hidden creatures before time runs out!</p>
        
        <div class="mode-selection">
            <button class="mode-btn ladybug-theme" data-mode="ladybug">🐞 Easy: Time Trial (Ladybugs)</button>
            <button class="mode-btn butterfly-theme" data-mode="butterfly">🦋 Medium: Time Trial (Butterflies)</button>
            <button class="mode-btn bee-theme" data-mode="bee">🐝 Hard: Time Trial (Honeybees)</button>
            <button class="mode-btn endless-theme" data-mode="endless">♾️ Endless Mode (Butterflies)</button>
        </div>
    </div>

    <div id="game-over">
        <h1>Time's Up!</h1>
        <h2 id="final-score">You found 0 items!</h2>
        <br>
        <button id="restart-btn">Main Menu</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'catch') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'start') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'over') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }
    }

    const GAME_MODES = {
        butterfly: {
            target: '🦋',
            bgStyle: '#55ab37',
            clutterItems: ['🌸', '🌺', '🌷', '🌻', '🌼', '🪻'],
            themes: [
                { filter: 'hue-rotate(105deg) saturate(1.1) brightness(0.95)', clutterSubset: ['🌸', '🌺', '🌷'] },
                { filter: 'hue-rotate(-135deg) saturate(1.3) brightness(1.0)', clutterSubset: ['🌻', '🌼', '💛'] },
                { filter: 'hue-rotate(65deg) saturate(1.1) brightness(0.9)', clutterSubset: ['🪻', '🌸', '💜'] }
            ]
        },
        ladybug: {
            target: '🐞',
            bgStyle: '#24482c',
            clutterItems: ['🌹', '🥀', '🌿', '🍃', '☘️'],
            themes: [
                { filter: 'saturate(0.9) brightness(0.9)', clutterSubset: ['🌹', '🌿', '🍃'] },
                { filter: 'hue-rotate(-5deg) saturate(0.95) brightness(0.95)', clutterSubset: ['🌹', '🥀', '☘️', '🌿'] }
            ]
        },
        bee: {
            target: '🐝',
            bgStyle: '#e6a100',
            clutterItems: ['🌻', '🌼', '🌾', '🟡', '⭐'],
            themes: [
                { filter: 'brightness(1.05) contrast(1.1) saturate(1.2)', clutterSubset: ['🌻', '🌼', '🌾'] },
                { filter: 'brightness(1.1) saturate(1.3)', clutterSubset: ['🌻', '🌾'] }
            ]
        },
        endless: {
            target: '🦋',
            bgStyle: '#55ab37',
            clutterItems: ['🌸', '🌺', '🌷', '🌻', '🌼', '🪻'],
            themes: [
                { filter: 'hue-rotate(105deg) saturate(1.1) brightness(0.95)', clutterSubset: ['🌸', '🌺', '🌷'] },
                { filter: 'hue-rotate(-135deg) saturate(1.3) brightness(1.0)', clutterSubset: ['🌻', '🌼', '💛'] },
                { filter: 'hue-rotate(65deg) saturate(1.1) brightness(0.9)', clutterSubset: ['🪻', '🌸', '💜'] }
            ]
        }
    };

    let currentMode = 'ladybug';
    let score = 0;
    let timeLeft = 60;
    let timerInterval;
    let currentRound = 1; 
    let itemsFoundInRound = 0;
    
    const uiLayer = document.getElementById('ui-layer');
    const entitiesLayer = document.getElementById('entities-layer');
    const splashScreen = document.getElementById('splash-screen');
    const gameOverScreen = document.getElementById('game-over');
    const scoreDisplay = document.getElementById('score-display');
    const timeDisplay = document.getElementById('time-display');
    const finalScoreDisplay = document.getElementById('final-score');
    const gameContainer = document.getElementById('game-container');

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            currentMode = e.target.getAttribute('data-mode');
            startGame();
        });
    });

    document.getElementById('restart-btn').addEventListener('click', goToMenu);
    document.getElementById('menu-btn').addEventListener('click', goToMenu);

    function goToMenu() {
        clearInterval(timerInterval);
        uiLayer.style.display = 'none';
        gameOverScreen.style.display = 'none';
        entitiesLayer.innerHTML = '';
        gameContainer.style.backgroundColor = '#55ab37';
        splashScreen.style.display = 'flex';
    }

    function startGame() {
        playSound('start');
        splashScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        uiLayer.style.display = 'flex';
        
        gameContainer.style.backgroundColor = GAME_MODES[currentMode].bgStyle;

        score = 0;
        currentRound = 1;

        if (currentMode === 'endless') {
            timeLeft = 11; // Endless mode gives 11 seconds per round
        } else {
            timeLeft = 60; // Time trial starts with 60 seconds
        }

        updateUI();
        spawnLevel();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateUI();
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updateUI() {
        scoreDisplay.innerText = `Score: ${score}`;
        timeDisplay.innerText = `Time: ${timeLeft}`;
    }

    function spawnLevel() {
        entitiesLayer.innerHTML = ''; 
        itemsFoundInRound = 0;

        const modeData = GAME_MODES[currentMode];
        const activeTheme = modeData.themes[Math.floor(Math.random() * modeData.themes.length)];

        let itemsToFind = 1;
        if (currentMode === 'endless') {
            itemsToFind = Math.floor((currentRound + 1) / 2); // Adds another butterfly every second level
        } else {
            if (currentRound > 2) itemsToFind = 2; 
            if (currentRound > 4) itemsToFind = 3; 
        }
        
        const targetCoordinates = [];
        const targetScale = Math.max(0.45, 0.75 - (currentRound * 0.025));

        for (let b = 0; b < itemsToFind; b++) {
            let bx, by, overlapping;
            let attempts = 0;
            
            do {
                overlapping = false;
                bx = 12 + Math.random() * 76; 
                by = 22 + Math.random() * 66;
                for (let coord of targetCoordinates) {
                    let distance = Math.hypot(coord.x - bx, coord.y - by);
                    if (distance < 28) {
                        overlapping = true;
                    }
                }
                attempts++;
            } while (overlapping && attempts < 40);

            const creature = document.createElement('div');
            creature.className = 'target-creature';
            creature.innerText = modeData.target;
            creature.style.filter = activeTheme.filter;
            creature.style.fontSize = `${2.5 * targetScale}rem`;
            
            creature.style.left = bx + 'vw';
            creature.style.top = by + 'vh';
            targetCoordinates.push({ x: bx, y: by });
            
            creature.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                
                if (creature.dataset.caught) return;
                creature.dataset.caught = "true";

                score++;
                itemsFoundInRound++;
                updateUI();
                playSound('catch');

                creature.style.animation = 'none';
                creature.style.opacity = '1';
                creature.style.filter = activeTheme.filter + ' drop-shadow(0 0 15px rgba(255,255,255,0.9))';
                creature.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                creature.style.transform = `translate(-50%, -50%) scale(${2.5 * targetScale})`;
                creature.style.zIndex = '50';

                if (itemsFoundInRound >= itemsToFind) {
                    document.querySelectorAll('.clutter').forEach(clutterEl => {
                        clutterEl.style.opacity = '0';
                    });

                    setTimeout(() => {
                        if (currentMode === 'endless' || timeLeft > 0) { 
                            currentRound++;
                            if (currentMode === 'endless') {
                                timeLeft = 11; // Reset to 11 seconds every level
                            }
                            spawnLevel();
                        }
                    }, 700);
                }
            });
            
            entitiesLayer.appendChild(creature);
        }

        const baseClutterCount = 220; 
        const difficultyBonus = currentRound * 45; 
        const totalClutter = baseClutterCount + difficultyBonus;

        for (let i = 0; i < totalClutter; i++) {
            const clutter = document.createElement('div');
            clutter.className = 'clutter';
            
            if (Math.random() < 0.90) {
                clutter.innerText = activeTheme.clutterSubset[Math.floor(Math.random() * activeTheme.clutterSubset.length)];
            } else {
                clutter.innerText = modeData.clutterItems[Math.floor(Math.random() * modeData.clutterItems.length)];
            }
            
            let fx = Math.random() * 100;
            let fy = 15 + Math.random() * 85;

            if (i < 70 * itemsToFind && i < totalClutter) {
                const targetB = targetCoordinates[i % itemsToFind];
                fx = targetB.x + (Math.random() * 14 - 7);
                fy = targetB.y + (Math.random() * 14 - 7);
            }
            
            clutter.style.left = fx + 'vw';
            clutter.style.top = fy + 'vh';
            
            const rot = Math.random() * 360;
            const scale = 0.6 + Math.random() * 0.5;
            clutter.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(${scale})`;
            
            entitiesLayer.appendChild(clutter);
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        playSound('over');
        uiLayer.style.display = 'none';
        entitiesLayer.innerHTML = '';
        gameOverScreen.style.display = 'flex';
        finalScoreDisplay.innerText = `You found ${score} items!`;
    }
</script>
</body>
</html>
